<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Get EmotionsMap</title>
    <meta name="description" content="Download EmotionsMap on App Store or Google Play." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#88B486" />
    <meta name="apple-itunes-app" content="app-id=6756886570" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #FAF8F4;
        --surface: #FFFFFF;
        --primary: #88B486;
        --primary-dark: #5E8A5C;
        --secondary: #90AFCF;
        --text: #1F2D1F;
        --muted: #5A6760;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: var(--surface);
        border-radius: 28px;
        padding: 40px 32px;
        box-shadow: 0 16px 40px rgba(31, 45, 31, 0.08), 0 0 0 1px rgba(31, 45, 31, 0.04);
        text-align: center;
        animation: fadeIn 400ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(31, 45, 31, 0.08);
      }
      .logo img { width: 100%; height: 100%; display: block; }
      h1 {
        font-family: 'Fraunces', 'Montserrat', Georgia, serif;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      p.lead {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 28px;
      }
      .buttons {
        display: grid;
        gap: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1),
                    box-shadow 240ms cubic-bezier(0.23, 1, 0.32, 1);
        will-change: transform;
      }
      .btn:active { transform: scale(0.97); }
      .btn-apple {
        background: var(--text);
        color: #FFFFFF;
        box-shadow: 0 12px 28px rgba(31, 45, 31, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .btn-google {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 12px 28px rgba(31, 45, 31, 0.06), 0 0 0 1px rgba(31, 45, 31, 0.10);
      }
      @media (hover: hover) and (pointer: fine) {
        .btn-apple:hover { box-shadow: 0 18px 40px rgba(31, 45, 31, 0.30); }
        .btn-google:hover { box-shadow: 0 18px 40px rgba(31, 45, 31, 0.12), 0 0 0 1px rgba(31, 45, 31, 0.16); }
      }
      .btn .label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
      .btn .label small {
        font-size: 0.7rem; font-weight: 500; opacity: 0.78; letter-spacing: 0.04em; text-transform: uppercase;
      }
      .btn .label strong { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
      .footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(31, 45, 31, 0.08);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .footer a { color: var(--primary-dark); text-decoration: none; font-weight: 500; }
      .footer a:hover { text-decoration: underline; }
      .redirect-msg {
        display: none;
        margin-bottom: 16px;
        padding: 10px 14px;
        background: rgba(136, 180, 134, 0.10);
        border-radius: 12px;
        font-size: 0.85rem;
        color: var(--primary-dark);
        font-weight: 500;
      }
      .redirect-msg.show { display: block; }
      .spinner {
        display: inline-block;
        width: 12px; height: 12px;
        border: 2px solid rgba(94, 138, 92, 0.25);
        border-top-color: var(--primary-dark);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
        margin-right: 8px;
        vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">
        <img src="/favicon.png" alt="" width="72" height="72" />
      </div>
      <h1>Get EmotionsMap</h1>
      <p class="lead">Visualize your emotions, take care of your wellbeing.</p>

      <div class="redirect-msg" id="redirect-msg">
        <span class="spinner"></span><span id="redirect-text">Redirecting to the store…</span>
      </div>

      <div class="buttons">
        <a id="btn-apple" class="btn btn-apple" href="https://apps.apple.com/app/feelmap/id6756886570" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          <span class="label"><small>Download on</small><strong>App Store</strong></span>
        </a>
        <a id="btn-google" class="btn btn-google" href="https://play.google.com/store/apps/details?id=com.hveitia.moodgrid.moodgrid" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
            <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
          </svg>
          <span class="label"><small>Get it on</small><strong>Google Play</strong></span>
        </a>
      </div>

      <div class="footer">
        <a href="/">← emotionsmap.com</a>
      </div>
    </main>

    <script>
      (function () {
        var APP_STORE = 'https://apps.apple.com/app/feelmap/id6756886570';
        var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.hveitia.moodgrid.moodgrid';

        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        // iPadOS 13+ reports as Mac; detect touch + Safari
        if (!isIOS && /Macintosh/.test(ua) && navigator.maxTouchPoints > 1) {
          isIOS = true;
        }
        var isAndroid = /Android/i.test(ua);

        var msg = document.getElementById('redirect-msg');
        var msgText = document.getElementById('redirect-text');

        function go(url, label) {
          msgText.textContent = 'Redirecting to ' + label + '…';
          msg.classList.add('show');
          // Pequeño delay para que el usuario vea el feedback
          setTimeout(function () {
            window.location.replace(url);
          }, 350);
        }

        if (isIOS) {
          go(APP_STORE, 'App Store');
        } else if (isAndroid) {
          go(PLAY_STORE, 'Google Play');
        }
        // Desktop / otros: no redirige; muestra los botones.
      })();
    </script>
  </body>
</html>
